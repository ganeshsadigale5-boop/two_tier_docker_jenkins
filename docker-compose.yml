
services:
  db:
    image: mysql:8.4
    container_name: two-tier-mysql
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - two-tier-network

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: two-tier-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db

    depends_on:
      db:
        condition: service_healthy

    networks:
      - two-tier-network

  frontend:
    build:
      context: ./frontend
    container_name: two-tier-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - two-tier-network

volumes:
  mysql_data:

networks:
  two-tier-network:
    driver: bridge

